# .github/workflows/terraform-deploy.example.yml
#
# OPTIONAL deployment workflow using GitHub Actions OIDC. This file is named
# *.example.yml so it does NOT run automatically. To enable it:
#   1. Rename to terraform-deploy.yml.
#   2. Set repository variable (or environment secret) AWS_DEPLOY_ROLE_ARN
#      to the OIDC IAM role ARN (see docs/github-oidc.md for the trust policy).
#   3. Set repository variable AWS_REGION (e.g. ap-northeast-1).
#   4. Create a protected GitHub Environment named "production" with required
#      reviewers for the apply job.
#
# This workflow never uses long-lived AWS access keys. It plans on pull requests
# and applies only after manual approval on a protected environment.

name: terraform deploy (example)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "examples/production/**"

permissions:
  contents: read
  id-token: write  # required for OIDC

concurrency:
  group: terraform-deploy-production
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform plan (pull request)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: examples/production
        run: terraform init -input=false

      - name: Terraform fmt
        working-directory: examples/production
        run: terraform fmt -check

      - name: Terraform validate
        working-directory: examples/production
        run: terraform validate

      - name: Terraform plan
        working-directory: examples/production
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: examples/production/tfplan
          retention-days: 7

  apply:
    name: Terraform apply (production, manual approval)
    needs: plan
    runs-on: ubuntu-latest
    environment: production  # protected environment with required reviewers
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: examples/production

      - name: Terraform init
        working-directory: examples/production
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: examples/production
        run: terraform apply -input=false -auto-approve tfplan
