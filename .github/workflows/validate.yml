name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform, tests, and IaC security validation
    runs-on: ubuntu-latest
    env:
      # Fake placeholder AWS values for OFFLINE validation only. Not real, valid, live,
      # temporary, sandbox, or test-account credentials. They only satisfy the AWS
      # Terraform provider's credential parsing; no AWS API calls are made and
      # terraform plan/apply are never run in CI. See scripts/offline-env.sh.
      AWS_ACCESS_KEY_ID: mock_access_key
      AWS_SECRET_ACCESS_KEY: mock_secret_key
      AWS_SESSION_TOKEN: mock_session_token
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_REGION: ap-northeast-1
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_offline_validation: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/python/requirements.txt checkov PyYAML

      - name: Terraform format check
        run: terraform fmt -check -recursive -write=false .

      - name: Validate production example
        working-directory: examples/production
        run: |
          terraform init -backend=false -input=false -lock=false
          terraform validate

      - name: Validate lab example
        working-directory: examples/lab
        run: |
          terraform init -backend=false -input=false -lock=false
          terraform validate

      - name: Terraform native tests (rds)
        working-directory: modules/rds
        run: |
          terraform init -backend=false -input=false -lock=false
          terraform test

      - name: Terraform native tests (network)
        working-directory: modules/network
        run: |
          terraform init -backend=false -input=false -lock=false
          terraform test

      - name: Python security-invariant tests
        run: python -m pytest tests/python -q

      - name: Checkov IaC scan (production example)
        run: checkov -d examples/production --framework terraform --quiet

      - name: Checkov IaC scan (lab example)
        run: checkov -d examples/lab --framework terraform --quiet

      - name: YAML/JSON well-formedness
        run: python scripts/_check_yaml_json.py

      - name: Full validation script
        run: bash scripts/validate.sh

      - name: Upload checkov reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            /tmp/checkov.out
            /tmp/pytest.out
            /tmp/tftest.out
          if-no-files-found: ignore