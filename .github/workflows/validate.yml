name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform, tests, and IaC security validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/python/requirements.txt checkov PyYAML yamllint pymarkdownlnt

      - name: Install shellcheck, actionlint, gitleaks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C /usr/local/bin actionlint
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Terraform format check
        run: terraform fmt -check -recursive -write=false .

      - name: Validate production example
        working-directory: examples/production
        run: |
          terraform init -backend=false -input=false -lock=false
          terraform validate

      - name: Validate lab example
        working-directory: examples/lab
        run: |
          terraform init -backend=false -input=false -lock=false
          terraform validate

      - name: Terraform native tests (rds)
        working-directory: modules/rds
        run: |
          terraform init -backend=false -input=false -lock=false
          terraform test

      - name: Terraform native tests (network)
        working-directory: modules/network
        run: |
          terraform init -backend=false -input=false -lock=false
          terraform test

      - name: Python security-invariant tests
        run: python -m pytest tests/python -q

      - name: Checkov IaC scan (production example)
        run: checkov -d examples/production --framework terraform --quiet

      - name: Checkov IaC scan (lab example)
        run: checkov -d examples/lab --framework terraform --quiet

      - name: YAML/JSON well-formedness
        run: python scripts/_check_yaml_json.py

      - name: Full validation script (tflint, yamllint, actionlint, shellcheck, gitleaks, markdownlint)
        run: bash scripts/validate.sh

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            /tmp/checkov.out
            /tmp/pytest.out
            /tmp/tftest.out
            /tmp/tflint.out
            /tmp/yamllint.out
            /tmp/actionlint.out
            /tmp/shellcheck.out
            /tmp/gitleaks.out
            /tmp/markdownlint.out
          if-no-files-found: ignore
